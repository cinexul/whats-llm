[workspace]
members = ["crates/study-core"]

[package]
name = "whats-llm"
version = "0.1.0"
description = "LLM Learning Book — an offline trilingual (zh/ja/en) e-book reader"
authors = []
license = "MIT"
repository = "https://github.com/cinexul/whats-llm"
edition = "2021"
rust-version = "1.77.2"

# 更多配置项及定义见https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.9.5", features = [] }
tauri-plugin-log = "2"
study-core = { path = "crates/study-core" }
