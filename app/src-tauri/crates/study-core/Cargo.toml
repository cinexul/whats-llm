[package]
name = "study-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
description = "Spaced-repetition (FSRS) scheduling, review log, and stats over an embedded SQLite store. Shared by the app and any future tool."

[lib]
name = "study_core"

[dependencies]
# 埋め込みSQLite。bundledでCソースごとバイナリへ静的リンクする(利用者は何もインストール不要)。
# 0.40系はlibsqlite3-sys 0.38を引き、そのbuild.rsが未安定のcfg_select! を使うためstableで不可。
# APIは同一なので、stableでビルドできる版に固定する。
rusqlite = { version = "0.32", features = ["bundled"] }
# FSRS(Ankiと同じopen-spaced-repetitionのクレート)。スケジューラ + オプティマイザ。
fsrs = "6"
# Tauri境界(JSへJSONで返す)用にCard/Reviewを直接シリアライズできるようにする。
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# 生成并读取网页版和桌面版共用的FSRS对照数据(app/tests/fixtures/fsrs-schedule.json)
serde_json = "1"
