[package]
name = "search-core"
version = "0.1.0"
edition = "2021"
description = "Reusable semantic-search core for What's LLM (chunking, index, cosine ranking, embedding)"

[lib]
name = "search_core"

[dependencies]
serde = { version = "1", features = ["derive"] }
bincode = "1.3"

# 嵌入推理（通过ONNX Runtime运行EmbeddingGemma）是可选功能，因此
# 纯逻辑部分的构建和单元测试无需引入大型ONNX依赖。模型文件从
# 本地加载，所以禁用hf-hub和图像模型；构建时下载ONNX Runtime
# 使用rustls，避免依赖系统OpenSSL。
fastembed = { version = "5", optional = true, default-features = false, features = [
    "ort-download-binaries-rustls-tls",
] }
anyhow = { version = "1", optional = true }

[features]
embed = ["dep:fastembed", "dep:anyhow"]
