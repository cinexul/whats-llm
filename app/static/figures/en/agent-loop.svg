<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
<title>The agent loop: the model fills in a request, the surrounding software checks permission and runs it, and the result goes back into the context until the task is done</title>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#56544b"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#aa563d"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d6a8a"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5f7f3a"/></marker>
</defs>
<rect x="0.75" y="0.75" width="718.5" height="418.5" rx="12" fill="#faf9f5" stroke="#e5e1d8" stroke-width="1.5"/>
<g font-family="system-ui,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
<rect x="178" y="30" width="526" height="148" rx="12" fill="#faece7"/>
<text x="194" y="54" font-size="14" fill="#aa563d" font-weight="600">Model: only writes text</text>
<rect x="178" y="242" width="526" height="148" rx="12" fill="#e6eef4"/>
<text x="194" y="380" font-size="14" fill="#3d6a8a" font-weight="600">Surrounding software: actually runs it</text>
<rect x="12" y="72" width="142" height="80" rx="10" fill="#f6efd9" stroke="#b08a2e" stroke-width="1.5"/>
<text x="83.0" y="106" font-size="15" fill="#191919" text-anchor="middle" font-weight="600">Your goal</text>
<text x="83.0" y="132" font-size="14" fill="#56544b" text-anchor="middle">Compare 3 venues</text>

<rect x="12" y="270" width="142" height="80" rx="10" fill="#edf2e4" stroke="#5f7f3a" stroke-width="1.5"/>
<text x="83.0" y="304" font-size="15" fill="#191919" text-anchor="middle" font-weight="600">Deliver</text>
<text x="83.0" y="330" font-size="14" fill="#56544b" text-anchor="middle">with sources</text>

<rect x="198" y="72" width="190" height="80" rx="10" fill="#ffffff" stroke="#aa563d" stroke-width="1.5"/>
<text x="293.0" y="106" font-size="15" fill="#191919" text-anchor="middle" font-weight="600">① Read context</text>
<text x="293.0" y="132" font-size="14" fill="#56544b" text-anchor="middle">decide the next step</text>

<rect x="494" y="72" width="190" height="80" rx="10" fill="#ffffff" stroke="#aa563d" stroke-width="1.5"/>
<text x="589.0" y="106" font-size="15" fill="#191919" text-anchor="middle" font-weight="600">② Fill in a request</text>
<text x="589.0" y="132" font-size="14" fill="#56544b" text-anchor="middle">tool name + inputs</text>

<rect x="494" y="270" width="190" height="80" rx="10" fill="#ffffff" stroke="#3d6a8a" stroke-width="1.5"/>
<text x="589.0" y="304" font-size="15" fill="#191919" text-anchor="middle" font-weight="600">③ Counter runs it</text>
<text x="589.0" y="330" font-size="14" fill="#56544b" text-anchor="middle">checks permission first</text>

<rect x="198" y="270" width="190" height="80" rx="10" fill="#ffffff" stroke="#3d6a8a" stroke-width="1.5"/>
<text x="293.0" y="304" font-size="15" fill="#191919" text-anchor="middle" font-weight="600">④ Receipt goes back</text>
<text x="293.0" y="330" font-size="14" fill="#56544b" text-anchor="middle">into the context</text>

<line x1="154" y1="100" x2="196" y2="100" stroke="#56544b" stroke-width="2" marker-end="url(#a)"/>
<line x1="388" y1="112" x2="492" y2="112" stroke="#aa563d" stroke-width="2" marker-end="url(#r)"/>
<line x1="589" y1="152" x2="589" y2="268" stroke="#aa563d" stroke-width="2" marker-end="url(#r)"/>
<line x1="494" y1="310" x2="390" y2="310" stroke="#3d6a8a" stroke-width="2" marker-end="url(#b)"/>
<line x1="293" y1="270" x2="293" y2="154" stroke="#3d6a8a" stroke-width="2" marker-end="url(#b)"/>
<path d="M198 130 H168 V330 H156" fill="none" stroke="#5f7f3a" stroke-width="2" marker-end="url(#g)"/>
<text x="441" y="216" font-size="15" fill="#191919" text-anchor="middle" font-weight="600">act → observe → decide again</text>
<text x="601" y="216" font-size="14" fill="#aa563d">hand over</text>
<text x="281" y="216" font-size="14" fill="#3d6a8a" text-anchor="end">read receipt</text>
<text x="160" y="216" font-size="14" fill="#5f7f3a" text-anchor="end">when done</text>
</g>
</svg>
