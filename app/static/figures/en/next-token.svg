<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 425" role="img" font-family="system-ui,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
  <title>Probabilities for the next token (made-up numbers)</title>
  <rect x="1" y="1" width="718" height="423" rx="12" fill="#faf9f5" stroke="#e5e1d8"/>
  <text x="28" y="34" font-size="18" font-weight="600" fill="#191919">Probabilities for the next token (made-up numbers)</text>
  <text x="28" y="60" font-size="15" fill="#56544b">Before: "The capital of Japan is" → what is the next token?</text>
  <text x="196" y="96" text-anchor="end" font-size="15" fill="#191919">Tokyo</text>
  <rect x="208" y="81" width="340.4" height="20" rx="3" fill="#faece7" stroke="#aa563d" stroke-width="1.5"/>
  <text x="556.4" y="96" font-size="15" font-weight="600" fill="#191919">92%</text>
  <text x="196" y="125" text-anchor="end" font-size="15" fill="#191919">Japan</text>
  <rect x="208" y="110" width="7.4" height="20" rx="3" fill="#f6efd9" stroke="#b08a2e" stroke-width="1.5"/>
  <text x="223.4" y="125" font-size="15" font-weight="600" fill="#191919">2%</text>
  <text x="196" y="154" text-anchor="end" font-size="15" fill="#191919">Osaka</text>
  <rect x="208" y="139" width="5.5" height="20" rx="3" fill="#f6efd9" stroke="#b08a2e" stroke-width="1.5"/>
  <text x="221.6" y="154" font-size="15" font-weight="600" fill="#191919">1.5%</text>
  <text x="196" y="183" text-anchor="end" font-size="15" fill="#191919">Edo</text>
  <rect x="208" y="168" width="3.0" height="20" rx="3" fill="#f6efd9" stroke="#b08a2e" stroke-width="1.5"/>
  <text x="219.0" y="183" font-size="15" font-weight="600" fill="#191919">0.8%</text>
  <text x="196" y="212" text-anchor="end" font-size="15" fill="#191919">all other candidates</text>
  <rect x="208" y="197" width="13.7" height="20" rx="3" fill="#ffffff" stroke="#56544b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="229.7" y="212" font-size="15" font-weight="600" fill="#191919">3.7%</text>
  <line x1="208" y1="76" x2="208" y2="225" stroke="#56544b" stroke-width="1.5"/>
  <line x1="28" y1="239" x2="692" y2="239" stroke="#e5e1d8" stroke-width="1.5"/>
  <text x="28" y="269" font-size="16" font-weight="600" fill="#191919">The same list, picked at different temperatures (chapter 8)</text>
  <text x="196" y="306" text-anchor="end" font-size="15" fill="#191919">Temp 0.5</text>
  <rect x="208" y="289" width="369.6" height="24" fill="#faece7" stroke="#aa563d" stroke-width="1.5"/>
  <rect x="577.6" y="289" width="0.4" height="24" fill="#f6efd9" stroke="#b08a2e" stroke-width="1.5"/>
  <text x="218" y="306" font-size="15" fill="#191919">Tokyo 99.9%</text>
  <text x="588" y="306" font-size="15" fill="#56544b">other 0.1%</text>
  <text x="196" y="340" text-anchor="end" font-size="15" fill="#191919">Temp 1 (as is)</text>
  <rect x="208" y="323" width="340.4" height="24" fill="#faece7" stroke="#aa563d" stroke-width="1.5"/>
  <rect x="548.4" y="323" width="29.6" height="24" fill="#f6efd9" stroke="#b08a2e" stroke-width="1.5"/>
  <text x="218" y="340" font-size="15" fill="#191919">Tokyo 92%</text>
  <text x="588" y="340" font-size="15" fill="#56544b">other 8%</text>
  <text x="196" y="374" text-anchor="end" font-size="15" fill="#191919">Temp 1.5</text>
  <rect x="208" y="357" width="236.8" height="24" fill="#faece7" stroke="#aa563d" stroke-width="1.5"/>
  <rect x="444.8" y="357" width="133.2" height="24" fill="#f6efd9" stroke="#b08a2e" stroke-width="1.5"/>
  <text x="218" y="374" font-size="15" fill="#191919">Tokyo ~64%</text>
  <text x="588" y="374" font-size="15" fill="#56544b">other ~36%</text>
  <text x="28" y="407" font-size="14" fill="#56544b">Temperature only changes the odds of each pick; it adds no knowledge and no correctness.</text>
</svg>
