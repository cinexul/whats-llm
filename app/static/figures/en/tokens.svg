  <text x="28" y="284" font-size="14" fill="#56544b">· marks a space; most English tokens include the space before the word</text>
  <line x1="28" y1="298" x2="692" y2="298" stroke="#e5e1d8" stroke-width="1.5"/>
  <text x="28" y="324" font-size="15" font-weight="600" fill="#191919">The same sentence in three languages</text>
  <text x="380" y="348" text-anchor="middle" font-size="15" fill="#191919">Chinese</text>
  <text x="380" y="366" text-anchor="middle" font-size="14" fill="#56544b">25 chars</text>
  <text x="500" y="348" text-anchor="middle" font-size="15" fill="#191919">Japanese</text>
  <text x="500" y="366" text-anchor="middle" font-size="14" fill="#56544b">35 chars</text>
  <text x="620" y="348" text-anchor="middle" font-size="15" fill="#191919">English</text>
  <text x="620" y="366" text-anchor="middle" font-size="14" fill="#56544b">95 chars</text>
