  <text x="288.9" y="119.5" text-anchor="middle" font-size="15" fill="#191919">·an</text>
  <rect x="310.5" y="100" width="66.8" height="28" rx="6" fill="#faece7" stroke="#aa563d" stroke-width="1.5"/>
  <text x="343.9" y="119.5" text-anchor="middle" font-size="15" fill="#191919">·email</text>
  <rect x="381.2" y="100" width="80.2" height="28" rx="6" fill="#faece7" stroke="#aa563d" stroke-width="1.5"/>
  <text x="421.4" y="119.5" text-anchor="middle" font-size="15" fill="#191919">·telling</text>
