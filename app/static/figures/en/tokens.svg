  <text x="692" y="90" text-anchor="end" font-size="16" font-weight="600" fill="#aa563d">21 tokens</text>
  <rect x="28.0" y="100" width="67.5" height="28" rx="6" fill="#faece7" stroke="#aa563d" stroke-width="1.5"/>
