  <rect x="489.3" y="135" width="30.3" height="28" rx="6" fill="#faece7" stroke="#aa563d" stroke-width="1.5"/>
  <text x="504.4" y="154.5" text-anchor="middle" font-size="15" fill="#191919">.m</text>
  <rect x="523.6" y="135" width="22.0" height="28" rx="6" fill="#faece7" stroke="#aa563d" stroke-width="1.5"/>
  <text x="534.6" y="154.5" text-anchor="middle" font-size="15" fill="#191919">.</text>
  <text x="28" y="192" font-size="15" fill="#191919">Qwen3 (Alibaba)</text>
  <text x="692" y="192" text-anchor="end" font-size="16" font-weight="600" fill="#3d6a8a">21 tokens</text>
