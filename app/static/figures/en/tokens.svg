<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 436" role="img" font-family="system-ui,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
  <title>One sentence, two tokenizers: how many tokens?</title>
  <rect x="1" y="1" width="718" height="434" rx="12" fill="#faf9f5" stroke="#e5e1d8"/>
  <text x="28" y="34" font-size="18" font-weight="600" fill="#191919">One sentence, two tokenizers: how many tokens?</text>
  <text x="28" y="58" font-size="14" fill="#56544b">Example sentence: 95 characters, counting spaces and punctuation</text>
