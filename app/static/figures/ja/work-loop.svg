<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img">
<title>作業ループ：調査 → 計画 → 実行 → 検収</title>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#56544b"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#aa563d"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5f7f3a"/></marker>
</defs>
<rect x="0.75" y="0.75" width="718.5" height="418.5" rx="12" fill="#faf9f5" stroke="#e5e1d8" stroke-width="1.5"/>
<g font-family="'Hiragino Sans','Yu Gothic','Meiryo','Noto Sans CJK JP','IPAGothic',sans-serif">
<text x="185.0" y="30" font-size="15" fill="#56544b" text-anchor="middle">あなたが目標を伝える</text>
<line x1="185.0" y1="38" x2="185.0" y2="61" stroke="#56544b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="30" y="64" width="310" height="84" rx="10" fill="#e6eef4" stroke="#3d6a8a" stroke-width="1.5"/>
<text x="185.0" y="98" font-size="18" fill="#191919" text-anchor="middle" font-weight="600">① 調査</text>
<text x="185.0" y="127" font-size="14" fill="#56544b" text-anchor="middle">あなた：探す場所が合っているか見る</text>
<rect x="380" y="64" width="310" height="84" rx="10" fill="#faece7" stroke="#aa563d" stroke-width="2"/>
<text x="535.0" y="98" font-size="18" fill="#191919" text-anchor="middle" font-weight="600">② 計画</text>
<text x="535.0" y="127" font-size="14" fill="#56544b" text-anchor="middle">あなた：計画を読み、承認してから実行</text>
<rect x="380" y="236" width="310" height="84" rx="10" fill="#e6eef4" stroke="#3d6a8a" stroke-width="1.5"/>
<text x="535.0" y="270" font-size="18" fill="#191919" text-anchor="middle" font-weight="600">③ 実行</text>
<text x="535.0" y="299" font-size="14" fill="#56544b" text-anchor="middle">あなた：見守り、それたら止める</text>
<rect x="30" y="236" width="310" height="84" rx="10" fill="#faece7" stroke="#aa563d" stroke-width="2"/>
<text x="185.0" y="270" font-size="18" fill="#191919" text-anchor="middle" font-weight="600">④ 検収</text>
<text x="185.0" y="299" font-size="14" fill="#56544b" text-anchor="middle">あなた：検収手順で試し、通ればマージ</text>
<line x1="342" y1="106.0" x2="377" y2="106.0" stroke="#56544b" stroke-width="2" marker-end="url(#a)"/>
<line x1="535.0" y1="150" x2="535.0" y2="233" stroke="#56544b" stroke-width="2" marker-end="url(#a)"/>
<line x1="378" y1="278.0" x2="343" y2="278.0" stroke="#56544b" stroke-width="2" marker-end="url(#a)"/>
<line x1="90" y1="234" x2="90" y2="151" stroke="#aa563d" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#r)"/>
<text x="104" y="197.0" font-size="15" fill="#aa563d" text-anchor="start" font-weight="600">不合格：調査か計画に戻る</text>
<line x1="185.0" y1="322" x2="185.0" y2="352" stroke="#5f7f3a" stroke-width="2" marker-end="url(#g)"/>
<rect x="30" y="355" width="310" height="40" rx="20" fill="#edf2e4" stroke="#5f7f3a" stroke-width="1.5"/>
<text x="185.0" y="380" font-size="15" fill="#191919" text-anchor="middle">合格：コミットして次の一歩へ</text>
<rect x="400" y="362" width="30" height="22" rx="5" fill="#faece7" stroke="#aa563d" stroke-width="2"/>
<text x="442" y="379" font-size="15" fill="#56544b" text-anchor="start">人が守る二つの関門</text>
</g></svg>
