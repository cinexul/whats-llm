<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 391" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','WenQuanYi Zen Hei',sans-serif">
  <title>上下文窗口：一次请求共用的token预算</title>
  <rect x="1" y="1" width="718" height="389" rx="12" fill="#faf9f5" stroke="#e5e1d8"/>
  <text x="28" y="34" font-size="18" font-weight="600" fill="#191919">上下文窗口：一次请求共用的token预算</text>
  <text x="28" y="58" font-size="14" fill="#56544b">每一格都要占用预算，加起来不能超过上限</text>
  <text x="692" y="88" text-anchor="end" font-size="14" fill="#aa563d">窗口上限</text>
  <line x1="692" y1="94" x2="692" y2="214" stroke="#aa563d" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="28" y="127" font-size="15" fill="#191919">对话刚开始</text>
  <rect x="164" y="100" width="96" height="42" rx="6" fill="#f6efd9" stroke="#b08a2e" stroke-width="1.5"/>
  <text x="212.0" y="126" text-anchor="middle" font-size="14" fill="#191919">系统指令</text>
  <rect x="260" y="100" width="92" height="42" rx="6" fill="#e6eef4" stroke="#3d6a8a" stroke-width="1.5"/>
  <text x="306.0" y="126" text-anchor="middle" font-size="14" fill="#191919">对话历史</text>
  <rect x="352" y="100" width="130" height="42" rx="6" fill="#edf2e4" stroke="#5f7f3a" stroke-width="1.5"/>
  <text x="417.0" y="126" text-anchor="middle" font-size="14" fill="#191919">附带资料</text>
  <rect x="482" y="100" width="100" height="42" rx="6" fill="#faece7" stroke="#aa563d" stroke-width="1.5"/>
  <text x="532.0" y="126" text-anchor="middle" font-size="14" fill="#191919">留给回答</text>
  <rect x="582" y="100" width="110" height="42" rx="6" fill="none" stroke="#56544b" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="637.0" y="126" text-anchor="middle" font-size="14" fill="#56544b">空余</text>
  <text x="28" y="187" font-size="15" fill="#191919">聊了很久</text>
  <rect x="164" y="160" width="96" height="42" rx="6" fill="#f6efd9" stroke="#b08a2e" stroke-width="1.5"/>
  <text x="212.0" y="186" text-anchor="middle" font-size="14" fill="#191919">系统指令</text>
  <rect x="260" y="160" width="222" height="42" rx="6" fill="#e6eef4" stroke="#3d6a8a" stroke-width="1.5"/>
  <text x="371.0" y="186" text-anchor="middle" font-size="14" fill="#191919">对话历史</text>
  <rect x="482" y="160" width="130" height="42" rx="6" fill="#edf2e4" stroke="#5f7f3a" stroke-width="1.5"/>
  <text x="547.0" y="186" text-anchor="middle" font-size="14" fill="#191919">附带资料</text>
  <rect x="612" y="160" width="80" height="42" rx="6" fill="#faece7" stroke="#aa563d" stroke-width="1.5"/>
  <text x="652.0" y="186" text-anchor="middle" font-size="14" fill="#191919">留给回答</text>
  <line x1="410" y1="210" x2="410" y2="232" stroke="#56544b" stroke-width="1.5"/>
  <path d="M 405 227 L 410 235 L 415 227" fill="none" stroke="#56544b" stroke-width="1.5"/>
  <text x="28" y="258" font-size="15" fill="#191919">快到上限时，产品可能会：</text>
  <rect x="28.0" y="270" width="158.5" height="54" rx="8" fill="#ffffff" stroke="#b08a2e" stroke-width="1.5"/>
  <text x="107.2" y="293" text-anchor="middle" font-size="14" fill="#191919">把旧对话</text>
  <text x="107.2" y="312" text-anchor="middle" font-size="14" fill="#191919">压缩成摘要</text>
  <rect x="196.5" y="270" width="158.5" height="54" rx="8" fill="#ffffff" stroke="#b08a2e" stroke-width="1.5"/>
  <text x="275.8" y="293" text-anchor="middle" font-size="14" fill="#191919">裁掉一部分</text>
  <text x="275.8" y="312" text-anchor="middle" font-size="14" fill="#191919">旧内容</text>
  <rect x="365.0" y="270" width="158.5" height="54" rx="8" fill="#ffffff" stroke="#b08a2e" stroke-width="1.5"/>
  <text x="444.2" y="293" text-anchor="middle" font-size="14" fill="#191919">只取出</text>
  <text x="444.2" y="312" text-anchor="middle" font-size="14" fill="#191919">相关片段</text>
  <rect x="533.5" y="270" width="158.5" height="54" rx="8" fill="#ffffff" stroke="#b08a2e" stroke-width="1.5"/>
  <text x="612.8" y="293" text-anchor="middle" font-size="14" fill="#191919">拒绝</text>
  <text x="612.8" y="312" text-anchor="middle" font-size="14" fill="#191919">过长的请求</text>
  <text x="28" y="352" font-size="14" fill="#56544b">用哪种做法由产品决定；细节可能丢失，但不一定是最早的内容先被删。</text>
  <text x="28" y="373" font-size="14" fill="#56544b">工具的定义和结果、推理模型的思考token（第8章）也占用这份预算。</text>
</svg>
