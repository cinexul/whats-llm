<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 436" role="img" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','WenQuanYi Zen Hei',sans-serif">
  <title>同一句话，两个分词器各切成多少个token</title>
  <rect x="1" y="1" width="718" height="434" rx="12" fill="#faf9f5" stroke="#e5e1d8"/>
  <text x="28" y="34" font-size="18" font-weight="600" fill="#191919">同一句话，两个分词器各切成多少个token</text>
  <text x="28" y="58" font-size="14" fill="#56544b">例句：请帮我写一封邮件，告诉同事明天的会议改到下午三点。（25个字）</text>
  <text x="28" y="90" font-size="15" fill="#191919">o200k_base（GPT-4o使用）</text>
  <text x="692" y="90" text-anchor="end" font-size="16" font-weight="600" fill="#aa563d">21个token</text>
  <rect x="28.0" y="100" width="27.0" height="28" rx="6" fill="#faece7" stroke="#aa563d" stroke-width="1.5"/>
  <text x="41.5" y="119.5" text-anchor="middle" font-size="15" fill="#191919">请</text>
  <rect x="59.0" y="100" width="27.0" height="28" rx="6" fill="#faece7" stroke="#aa563d" stroke-width="1.5"/>
  <text x="72.5" y="119.5" text-anchor="middle" font-size="15" fill="#191919">帮</text>
  <rect x="90.0" y="100" width="27.0" height="28" rx="6" fill="#faece7" stroke="#aa563d" stroke-width="1.5"/>
  <text x="103.5" y="119.5" text-anchor="middle" font-size="15" fill="#191919">我</text>
  <rect x="121.0" y="100" width="27.0" height="28" rx="6" fill="#faece7" stroke="#aa563d" stroke-width="1.5"/>
  <text x="134.5" y="119.5" text-anchor="middle" font-size="15" fill="#191919">写</text>
  <rect x="152.0" y="100" width="27.0" height="28" rx="6" fill="#faece7" stroke="#aa563d" stroke-width="1.5"/>
  <text x="165.5" y="119.5" text-anchor="middle" font-size="15" fill="#191919">一</text>
  <rect x="183.0" y="100" width="27.0" height="28" rx="6" fill="#faece7" stroke="#aa563d" stroke-width="1.5"/>
  <text x="196.5" y="119.5" text-anchor="middle" font-size="15" fill="#191919">封</text>
  <rect x="214.0" y="100" width="42.0" height="28" rx="6" fill="#faece7" stroke="#aa563d" stroke-width="1.5"/>
  <text x="235.0" y="119.5" text-anchor="middle" font-size="15" fill="#191919">邮件</text>
  <rect x="260.0" y="100" width="27.0" height="28" rx="6" fill="#faece7" stroke="#aa563d" stroke-width="1.5"/>
  <text x="273.5" y="119.5" text-anchor="middle" font-size="15" fill="#191919">，</text>
  <rect x="28.0" y="135" width="42.0" height="28" rx="6" fill="#faece7" stroke="#aa563d" stroke-width="1.5"/>
  <text x="49.0" y="154.5" text-anchor="middle" font-size="15" fill="#191919">告诉</text>
  <rect x="74.0" y="135" width="27.0" height="28" rx="6" fill="#faece7" stroke="#aa563d" stroke-width="1.5"/>
  <text x="87.5" y="154.5" text-anchor="middle" font-size="15" fill="#191919">同</text>
  <rect x="105.0" y="135" width="27.0" height="28" rx="6" fill="#faece7" stroke="#aa563d" stroke-width="1.5"/>
  <text x="118.5" y="154.5" text-anchor="middle" font-size="15" fill="#191919">事</text>
  <rect x="136.0" y="135" width="27.0" height="28" rx="6" fill="#faece7" stroke="#aa563d" stroke-width="1.5"/>
  <text x="149.5" y="154.5" text-anchor="middle" font-size="15" fill="#191919">明</text>
  <rect x="167.0" y="135" width="27.0" height="28" rx="6" fill="#faece7" stroke="#aa563d" stroke-width="1.5"/>
  <text x="180.5" y="154.5" text-anchor="middle" font-size="15" fill="#191919">天</text>
  <rect x="198.0" y="135" width="27.0" height="28" rx="6" fill="#faece7" stroke="#aa563d" stroke-width="1.5"/>
  <text x="211.5" y="154.5" text-anchor="middle" font-size="15" fill="#191919">的</text>
  <rect x="229.0" y="135" width="42.0" height="28" rx="6" fill="#faece7" stroke="#aa563d" stroke-width="1.5"/>
  <text x="250.0" y="154.5" text-anchor="middle" font-size="15" fill="#191919">会议</text>
  <rect x="275.0" y="135" width="27.0" height="28" rx="6" fill="#faece7" stroke="#aa563d" stroke-width="1.5"/>
  <text x="288.5" y="154.5" text-anchor="middle" font-size="15" fill="#191919">改</text>
  <rect x="306.0" y="135" width="27.0" height="28" rx="6" fill="#faece7" stroke="#aa563d" stroke-width="1.5"/>
  <text x="319.5" y="154.5" text-anchor="middle" font-size="15" fill="#191919">到</text>
  <rect x="337.0" y="135" width="42.0" height="28" rx="6" fill="#faece7" stroke="#aa563d" stroke-width="1.5"/>
  <text x="358.0" y="154.5" text-anchor="middle" font-size="15" fill="#191919">下午</text>
  <rect x="383.0" y="135" width="27.0" height="28" rx="6" fill="#faece7" stroke="#aa563d" stroke-width="1.5"/>
  <text x="396.5" y="154.5" text-anchor="middle" font-size="15" fill="#191919">三</text>
  <rect x="414.0" y="135" width="27.0" height="28" rx="6" fill="#faece7" stroke="#aa563d" stroke-width="1.5"/>
  <text x="427.5" y="154.5" text-anchor="middle" font-size="15" fill="#191919">点</text>
  <rect x="445.0" y="135" width="27.0" height="28" rx="6" fill="#faece7" stroke="#aa563d" stroke-width="1.5"/>
  <text x="458.5" y="154.5" text-anchor="middle" font-size="15" fill="#191919">。</text>
  <text x="28" y="192" font-size="15" fill="#191919">Qwen3（通义千问）</text>
  <text x="692" y="192" text-anchor="end" font-size="16" font-weight="600" fill="#3d6a8a">16个token</text>
  <rect x="28.0" y="202" width="27.0" height="28" rx="6" fill="#e6eef4" stroke="#3d6a8a" stroke-width="1.5"/>
  <text x="41.5" y="221.5" text-anchor="middle" font-size="15" fill="#191919">请</text>
  <rect x="59.0" y="202" width="42.0" height="28" rx="6" fill="#e6eef4" stroke="#3d6a8a" stroke-width="1.5"/>
  <text x="80.0" y="221.5" text-anchor="middle" font-size="15" fill="#191919">帮我</text>
  <rect x="105.0" y="202" width="27.0" height="28" rx="6" fill="#e6eef4" stroke="#3d6a8a" stroke-width="1.5"/>
  <text x="118.5" y="221.5" text-anchor="middle" font-size="15" fill="#191919">写</text>
  <rect x="136.0" y="202" width="42.0" height="28" rx="6" fill="#e6eef4" stroke="#3d6a8a" stroke-width="1.5"/>
  <text x="157.0" y="221.5" text-anchor="middle" font-size="15" fill="#191919">一封</text>
  <rect x="182.0" y="202" width="42.0" height="28" rx="6" fill="#e6eef4" stroke="#3d6a8a" stroke-width="1.5"/>
  <text x="203.0" y="221.5" text-anchor="middle" font-size="15" fill="#191919">邮件</text>
  <rect x="228.0" y="202" width="27.0" height="28" rx="6" fill="#e6eef4" stroke="#3d6a8a" stroke-width="1.5"/>
  <text x="241.5" y="221.5" text-anchor="middle" font-size="15" fill="#191919">，</text>
  <rect x="28.0" y="237" width="42.0" height="28" rx="6" fill="#e6eef4" stroke="#3d6a8a" stroke-width="1.5"/>
  <text x="49.0" y="256.5" text-anchor="middle" font-size="15" fill="#191919">告诉</text>
  <rect x="74.0" y="237" width="42.0" height="28" rx="6" fill="#e6eef4" stroke="#3d6a8a" stroke-width="1.5"/>
  <text x="95.0" y="256.5" text-anchor="middle" font-size="15" fill="#191919">同事</text>
  <rect x="120.0" y="237" width="42.0" height="28" rx="6" fill="#e6eef4" stroke="#3d6a8a" stroke-width="1.5"/>
  <text x="141.0" y="256.5" text-anchor="middle" font-size="15" fill="#191919">明天</text>
  <rect x="166.0" y="237" width="27.0" height="28" rx="6" fill="#e6eef4" stroke="#3d6a8a" stroke-width="1.5"/>
  <text x="179.5" y="256.5" text-anchor="middle" font-size="15" fill="#191919">的</text>
  <rect x="197.0" y="237" width="42.0" height="28" rx="6" fill="#e6eef4" stroke="#3d6a8a" stroke-width="1.5"/>
  <text x="218.0" y="256.5" text-anchor="middle" font-size="15" fill="#191919">会议</text>
  <rect x="243.0" y="237" width="27.0" height="28" rx="6" fill="#e6eef4" stroke="#3d6a8a" stroke-width="1.5"/>
  <text x="256.5" y="256.5" text-anchor="middle" font-size="15" fill="#191919">改</text>
  <rect x="274.0" y="237" width="27.0" height="28" rx="6" fill="#e6eef4" stroke="#3d6a8a" stroke-width="1.5"/>
  <text x="287.5" y="256.5" text-anchor="middle" font-size="15" fill="#191919">到</text>
  <rect x="305.0" y="237" width="42.0" height="28" rx="6" fill="#e6eef4" stroke="#3d6a8a" stroke-width="1.5"/>
  <text x="326.0" y="256.5" text-anchor="middle" font-size="15" fill="#191919">下午</text>
  <rect x="351.0" y="237" width="42.0" height="28" rx="6" fill="#e6eef4" stroke="#3d6a8a" stroke-width="1.5"/>
  <text x="372.0" y="256.5" text-anchor="middle" font-size="15" fill="#191919">三点</text>
  <rect x="397.0" y="237" width="27.0" height="28" rx="6" fill="#e6eef4" stroke="#3d6a8a" stroke-width="1.5"/>
  <text x="410.5" y="256.5" text-anchor="middle" font-size="15" fill="#191919">。</text>
  <text x="28" y="284" font-size="14" fill="#56544b">Qwen3把“帮我”“一封”“同事”“明天”“三点”各算作1个token</text>
  <line x1="28" y1="298" x2="692" y2="298" stroke="#e5e1d8" stroke-width="1.5"/>
  <text x="28" y="324" font-size="15" font-weight="600" fill="#191919">同一句话的三种语言版本</text>
  <text x="370" y="348" text-anchor="middle" font-size="15" fill="#191919">中文</text>
  <text x="370" y="366" text-anchor="middle" font-size="14" fill="#56544b">25字</text>
  <text x="490" y="348" text-anchor="middle" font-size="15" fill="#191919">日文</text>
  <text x="490" y="366" text-anchor="middle" font-size="14" fill="#56544b">35字</text>
  <text x="610" y="348" text-anchor="middle" font-size="15" fill="#191919">英文</text>
  <text x="610" y="366" text-anchor="middle" font-size="14" fill="#56544b">95字符</text>
  <text x="44" y="391" font-size="15" fill="#aa563d">o200k_base</text>
  <text x="370" y="391" text-anchor="middle" font-size="16" font-weight="600" fill="#191919">21</text>
  <text x="490" y="391" text-anchor="middle" font-size="16" font-weight="600" fill="#191919">25</text>
  <text x="610" y="391" text-anchor="middle" font-size="16" font-weight="600" fill="#191919">21</text>
  <text x="44" y="416" font-size="15" fill="#3d6a8a">Qwen3</text>
  <text x="370" y="416" text-anchor="middle" font-size="16" font-weight="600" fill="#191919">16</text>
  <text x="490" y="416" text-anchor="middle" font-size="16" font-weight="600" fill="#191919">23</text>
  <text x="610" y="416" text-anchor="middle" font-size="16" font-weight="600" fill="#191919">21</text>
</svg>
