name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '版本号，例如v1.0.0。留空只试打包，不建Release草稿'
        required: false

permissions:
  contents: write

concurrency:
  group: windows-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # 推送tag时用tag名；手动运行时用填写的版本号，留空表示只试打包
      RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, wasm32-unknown-unknown

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Install pinned WASM bindings generator
        run: cargo install wasm-bindgen-cli --version 0.2.108 --locked

      - name: Install frontend deps
        working-directory: app
        run: npm ci

      - name: Validate release tag
        if: env.RELEASE_TAG != ''
        shell: pwsh
        run: |
          if (-not $env:RELEASE_TAG.StartsWith('v')) {
            throw 'Release tags must start with v, for example v1.0.0.'
          }
          git check-ref-format "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Invalid release tag.' }
          $tagRefs = @(git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG" "refs/tags/$env:RELEASE_TAG^{}")
          if ($LASTEXITCODE -ne 0) { throw 'Failed to check the remote tag.' }
          if ($tagRefs.Count -gt 0) {
            $peeled = $tagRefs | Where-Object { $_.EndsWith('^{}') } | Select-Object -First 1
            $reference = if ($peeled) { $peeled } else { $tagRefs[0] }
            $tagSha = ($reference -split '\s+')[0]
            if ($tagSha -ne $env:GITHUB_SHA) {
              throw 'This tag points to a different commit. Build its tag ref or use a new tag.'
            }
          }

      - name: Validate tag matches app version
        if: env.RELEASE_TAG != ''
        shell: pwsh
        run: |
          $config = Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $expected = "v$($config.version)"
          if ($env:RELEASE_TAG -ne $expected) {
            throw "Tag $env:RELEASE_TAG does not match tauri.conf.json version $expected."
          }

      - name: Build Windows executable without installer
        working-directory: app
        run: npm run tauri -- build --no-bundle --ci --target x86_64-pc-windows-msvc -- --locked

      - name: Package portable ZIP
        id: portable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $config = Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $name = "LLM.Learning.Book_$($config.version)_windows-x64-portable"
          $dist = Join-Path $env:RUNNER_TEMP 'portable-dist'
          $folder = Join-Path $dist $name
          $release = Join-Path $env:GITHUB_WORKSPACE 'app/src-tauri/target/x86_64-pc-windows-msvc/release'
          New-Item -ItemType Directory -Path "$folder/data" -Force | Out-Null
          Copy-Item -LiteralPath "$release/whats-llm.exe" -Destination $folder
          # Native dependencies, if any.
          Get-ChildItem -LiteralPath $release -Filter '*.dll' -File |
            Copy-Item -Destination $folder
          # Use the redistributable CRT, never DLLs copied from Windows/System32.
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $runtimeFiles = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Redist\MSVC\**\x64\Microsoft.VC*.CRT\msvcp140.dll'
          if ($LASTEXITCODE -ne 0) { throw 'Failed to locate the Visual C++ runtime.' }
          $runtime = $runtimeFiles | Get-Item |
            Sort-Object {
              $v = $_.VersionInfo
              [version]::new($v.FileMajorPart, $v.FileMinorPart, $v.FileBuildPart, $v.FilePrivatePart)
            } -Descending |
            Select-Object -First 1
          if ($null -eq $runtime) { throw 'No x64 Visual C++ redistributable CRT was found.' }
          Get-ChildItem -LiteralPath $runtime.DirectoryName -Filter '*.dll' -File |
            Copy-Item -Destination $folder
          Copy-Item -LiteralPath docs/windows-portable.md -Destination "$folder/README.md"
          New-Item -ItemType Directory -Path "$folder/licenses" -Force | Out-Null
          Copy-Item -LiteralPath LICENSE, LICENSE-CONTENT -Destination "$folder/licenses"
          Copy-Item -LiteralPath app/static/tokenizers/NOTICE.txt -Destination "$folder/licenses/Qwen-tokenizer-NOTICE.txt"
          Copy-Item -LiteralPath app/static/tokenizers/ctok-NOTICE.txt -Destination "$folder/licenses/ctok-NOTICE.txt"
          Copy-Item -LiteralPath app/core/NOTICE.md -Destination "$folder/licenses/Rust-text-core-NOTICE.md"
          'Keep this folder next to whats-llm.exe. The learning database is saved here.' |
            Set-Content -LiteralPath "$folder/data/README.txt" -Encoding utf8

          $zip = Join-Path $dist "$name.zip"
          Compress-Archive -LiteralPath $folder -DestinationPath $zip -CompressionLevel Optimal
          $checksum = "$zip.sha256"
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name.zip" | Set-Content -LiteralPath $checksum -Encoding ascii
          "name=$name" >> $env:GITHUB_OUTPUT
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "checksum=$checksum" >> $env:GITHUB_OUTPUT

      - name: Test extracted portable app
        shell: pwsh
        env:
          PORTABLE_ZIP: ${{ steps.portable.outputs.zip }}
          PORTABLE_NAME: ${{ steps.portable.outputs.name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $destination = Join-Path $env:RUNNER_TEMP 'portable-smoke'
          Expand-Archive -LiteralPath $env:PORTABLE_ZIP -DestinationPath $destination
          $folder = Join-Path $destination $env:PORTABLE_NAME
          $exe = Join-Path $folder 'whats-llm.exe'
          $db = Join-Path $folder 'data/whatsllm.db'
          if (-not (Test-Path -LiteralPath "$folder/data" -PathType Container)) {
            throw 'Portable data directory is missing from the ZIP.'
          }
          foreach ($dll in @('msvcp140.dll', 'msvcp140_1.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')) {
            if (-not (Test-Path -LiteralPath (Join-Path $folder $dll) -PathType Leaf)) {
              throw "Visual C++ runtime DLL is missing from the ZIP: $dll"
            }
          }
          if (Test-Path -LiteralPath $db) { throw 'ZIP must not contain learning data.' }
          # Exclude the build directory from DLL lookup and isolate the WebView profile.
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $env:WEBVIEW2_USER_DATA_FOLDER = Join-Path $destination 'webview-profile'
          $appProcess = Start-Process -FilePath $exe -WorkingDirectory $folder -PassThru
          try {
            for ($attempt = 0; $attempt -lt 20; $attempt++) {
              Start-Sleep -Seconds 1
              $appProcess.Refresh()
              if ($appProcess.HasExited) {
                throw "Portable app exited during startup (exit code $($appProcess.ExitCode))."
              }
              if (($attempt -ge 4) -and (Test-Path -LiteralPath $db)) { break }
            }
            if (-not (Test-Path -LiteralPath $db)) {
              throw 'Portable app did not create its learning database in data/.'
            }
            Write-Host 'Extracted app started and initialized data/whatsllm.db.'
          } finally {
            $appProcess.Refresh()
            if (-not $appProcess.HasExited) { Stop-Process -Id $appProcess.Id -Force }
          }

      - name: Upload portable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.portable.outputs.name }}
          path: |
            ${{ steps.portable.outputs.zip }}
            ${{ steps.portable.outputs.checksum }}
          if-no-files-found: error
          compression-level: 0

      - name: Build and test Windows installer
        id: installer
        timeout-minutes: 10
        shell: pwsh
        env:
          PORTABLE_NAME: ${{ steps.portable.outputs.name }}
        run: ./.github/scripts/windows-installer.ps1

      - name: Upload installer build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LLM-Learning-Book-windows-x64-installer
          path: |
            ${{ steps.installer.outputs.exe }}
            ${{ steps.installer.outputs.checksum }}
          if-no-files-found: error
          compression-level: 0

      - name: Upload Windows packages to release draft
        if: env.RELEASE_TAG != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PORTABLE_ZIP: ${{ steps.portable.outputs.zip }}
          PORTABLE_CHECKSUM: ${{ steps.portable.outputs.checksum }}
          INSTALLER_EXE: ${{ steps.installer.outputs.exe }}
          INSTALLER_CHECKSUM: ${{ steps.installer.outputs.checksum }}
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Split-Path -Leaf $env:INSTALLER_EXE
          $zip = Split-Path -Leaf $env:PORTABLE_ZIP
          $notes = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          @"
          ## 本次更新

          ### 修复了 TS占比过多的漏洞 （不是

          - 分词与社区计数共用Rust核心：网页走WASM，桌面原生调用。
          - 移除测试文件、样例和专用依赖，简化维护配置。这是源码整理，不代表运行速度提升。
          - 保留类型、内容、Rust检查，以及Windows打包、安装和启动验证。
          - 学习记录、笔记与备份格式不变。

          ## 下载与升级

          Windows x64桌面版，两种任选一种：

          - **安装版**``$setup``：双击安装，不需要管理员权限。缺少WebView2时安装程序会自动下载。学习记录和笔记存在系统的用户数据目录。
          - **免安装版**``$zip``：完整解压后运行``whats-llm.exe``。学习记录和笔记存在旁边的``data/``文件夹，整个文件夹可以拷走；更新时保留``data/``，替换其余文件。需要电脑上已有Microsoft Edge WebView2 Runtime（Windows 11自带）。

          需要Windows 10或11（64位）。界面设置、阅读位置和本地正文修改存在WebView里，换电脑或换版本前请在“我的书包”导出学习备份，再到新版本里导入。每个文件都附有SHA-256校验文件。
          "@ | Set-Content -LiteralPath $notes -Encoding utf8
          $title = "$env:RELEASE_TAG   修复了 TS占比过多的漏洞 （不是"
          $draft = gh release view $env:RELEASE_TAG --json isDraft --jq '.isDraft' 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($draft -ne 'true') {
              throw 'This release is already published. Use a new tag to create a draft.'
            }
            gh release edit $env:RELEASE_TAG --target $env:GITHUB_SHA --title $title --notes-file $notes --prerelease=false
            if ($LASTEXITCODE -ne 0) { throw 'Failed to update the release draft.' }
            # 删掉草稿里以前留下的其他文件，免得新旧版本混在一起
            $keep = @($env:PORTABLE_ZIP, $env:PORTABLE_CHECKSUM, $env:INSTALLER_EXE, $env:INSTALLER_CHECKSUM) | ForEach-Object { Split-Path -Leaf $_ }
            $assets = @(gh release view $env:RELEASE_TAG --json assets --jq '.assets[].name')
            if ($LASTEXITCODE -ne 0) { throw 'Failed to list draft assets.' }
            foreach ($asset in $assets | Where-Object { $_ -and $keep -notcontains $_ }) {
              gh release delete-asset $env:RELEASE_TAG $asset --yes
              if ($LASTEXITCODE -ne 0) { throw "Failed to remove old asset $asset." }
            }
          } else {
            gh release create $env:RELEASE_TAG --draft --target $env:GITHUB_SHA --title $title --notes-file $notes
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create release draft.' }
          }
          gh release upload $env:RELEASE_TAG $env:PORTABLE_ZIP $env:PORTABLE_CHECKSUM $env:INSTALLER_EXE $env:INSTALLER_CHECKSUM --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Failed to upload Windows packages.' }
