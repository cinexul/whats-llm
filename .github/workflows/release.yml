name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '版本号 tag,例如 v0.1.0'
        required: true

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Install frontend deps
        working-directory: app
        run: npm ci

      - name: Validate release tag
        shell: pwsh
        run: |
          if (-not $env:RELEASE_TAG.StartsWith('v')) {
            throw 'Release tags must start with v, for example v0.1.0.'
          }
          git check-ref-format "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Invalid release tag.' }

      - name: Build Windows executable without installer
        working-directory: app
        run: npm run tauri -- build --no-bundle --ci --target x86_64-pc-windows-msvc -- --locked

      - name: Package portable ZIP
        id: portable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $config = Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $name = "Whats.LLM_$($config.version)_windows-x64-portable"
          $dist = Join-Path $env:RUNNER_TEMP 'portable-dist'
          $folder = Join-Path $dist $name
          $release = Join-Path $env:GITHUB_WORKSPACE 'app/src-tauri/target/x86_64-pc-windows-msvc/release'
          New-Item -ItemType Directory -Path "$folder/data" -Force | Out-Null
          Copy-Item -LiteralPath "$release/whats-llm.exe" -Destination $folder
          # Native dependencies (including ONNX Runtime when dynamically linked).
          Get-ChildItem -LiteralPath $release -Filter '*.dll' -File |
            Copy-Item -Destination $folder
          Copy-Item -LiteralPath docs/windows-portable.md -Destination "$folder/README.md"
          'Keep this folder next to whats-llm.exe. The learning database is saved here.' |
            Set-Content -LiteralPath "$folder/data/README.txt" -Encoding utf8

          $zip = Join-Path $dist "$name.zip"
          Compress-Archive -LiteralPath $folder -DestinationPath $zip -CompressionLevel Optimal
          $checksum = "$zip.sha256"
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name.zip" | Set-Content -LiteralPath $checksum -Encoding ascii
          "name=$name" >> $env:GITHUB_OUTPUT
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "checksum=$checksum" >> $env:GITHUB_OUTPUT

      - name: Test extracted portable app
        shell: pwsh
        env:
          PORTABLE_ZIP: ${{ steps.portable.outputs.zip }}
          PORTABLE_NAME: ${{ steps.portable.outputs.name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $destination = Join-Path $env:RUNNER_TEMP 'portable-smoke'
          Expand-Archive -LiteralPath $env:PORTABLE_ZIP -DestinationPath $destination
          $folder = Join-Path $destination $env:PORTABLE_NAME
          $exe = Join-Path $folder 'whats-llm.exe'
          $db = Join-Path $folder 'data/whatsllm.db'
          if (-not (Test-Path -LiteralPath "$folder/data" -PathType Container)) {
            throw 'Portable data directory is missing from the ZIP.'
          }
          if (Test-Path -LiteralPath $db) { throw 'ZIP must not contain learning data.' }
          # Exclude the build directory from DLL lookup and isolate the WebView profile.
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $env:WEBVIEW2_USER_DATA_FOLDER = Join-Path $destination 'webview-profile'
          $appProcess = Start-Process -FilePath $exe -WorkingDirectory $folder -PassThru
          try {
            for ($attempt = 0; $attempt -lt 20; $attempt++) {
              Start-Sleep -Seconds 1
              $appProcess.Refresh()
              if ($appProcess.HasExited) {
                throw "Portable app exited during startup (exit code $($appProcess.ExitCode))."
              }
              if (($attempt -ge 4) -and (Test-Path -LiteralPath $db)) { break }
            }
            if (-not (Test-Path -LiteralPath $db)) {
              throw 'Portable app did not create its learning database in data/.'
            }
            Write-Host 'Extracted app started and initialized data/whatsllm.db.'
          } finally {
            $appProcess.Refresh()
            if (-not $appProcess.HasExited) { Stop-Process -Id $appProcess.Id -Force }
          }

      - name: Upload portable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.portable.outputs.name }}
          path: |
            ${{ steps.portable.outputs.zip }}
            ${{ steps.portable.outputs.checksum }}
          if-no-files-found: error
          compression-level: 0

      - name: Upload portable ZIP to release draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PORTABLE_ZIP: ${{ steps.portable.outputs.zip }}
          PORTABLE_CHECKSUM: ${{ steps.portable.outputs.checksum }}
        run: |
          $ErrorActionPreference = 'Stop'
          $draft = gh release view $env:RELEASE_TAG --json isDraft --jq '.isDraft' 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($draft -ne 'true') {
              throw 'This release is already published. Use a new tag to create a draft.'
            }
          } else {
            $notes = Join-Path $env:RUNNER_TEMP 'portable-release-notes.md'
            @'
          Windows x64 免安装版：下载 ZIP，完整解压后运行 whats-llm.exe，无需安装本应用。
          请保留 data/ 文件夹和 DLL；更新时先导出学习备份，再替换程序文件。
          学习数据库保存在 data/，批注保存在程序旁；界面设置和本地正文修改仍由本机 WebView 保存，跨电脑请使用应用内的备份导出/导入。
          需要 Microsoft Edge WebView2 Runtime。未内置语义检索模型，使用关键词搜索。
          附带 SHA-256 校验文件。此版本保持草稿，等待人工确认后发布。
          '@ | Set-Content -LiteralPath $notes -Encoding utf8
            gh release create $env:RELEASE_TAG --draft --target $env:GITHUB_SHA --title "What's LLM $env:RELEASE_TAG (Windows portable)" --notes-file $notes
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create release draft.' }
          }
          gh release upload $env:RELEASE_TAG $env:PORTABLE_ZIP $env:PORTABLE_CHECKSUM --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Failed to upload portable ZIP.' }
