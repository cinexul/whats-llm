name: checks

on:
  push:
    branches: [main, test]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install pinned WASM bindings generator
        run: cargo install wasm-bindgen-cli --version 0.2.108 --locked
      - run: npm ci
      - run: npm run check
      - run: npm run content:check
      - run: npm run check:quiz
      - run: npm run build

  rust-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: cargo fmt --manifest-path ../core/Cargo.toml -- --check
      - run: cargo clippy --manifest-path ../core/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked -p study-core --all-targets -- -D warnings
